version: '3.8'

services:
  web:
    build: .
    command: >
      sh -c "
        echo 'Waiting for redis...' &&
        python faq/manage.py makemigrations &&
        python faq/manage.py migrate &&
        python faq/manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/1
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=faq.settings
      - DEBUG=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/faqs/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: "redis:latest"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  redis_data:

networks:
  default:
    driver: bridge